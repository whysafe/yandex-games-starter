<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>Орбита</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="stage">
  <canvas id="game" aria-label="Игровое поле"></canvas>

  <div class="hud" id="hud" hidden>
    <div><small data-t="score">Счёт</small><b id="score">0</b></div>
    <div class="r"><small data-t="best">Рекорд</small><b id="best">0</b></div>
  </div>

  <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="Звук">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg>
  </button>

  <section class="panel" id="menu" hidden>
    <h1 data-t="title">Орбита</h1>
    <p data-t="hint">Нажатие переключает орбиту. Собирайте звёзды, уворачивайтесь от метеоритов.</p>
    <span class="pulse" data-t="tap">Нажмите, чтобы начать</span>
  </section>

  <section class="panel" id="over" hidden>
    <h2 data-t="over">Столкновение</h2>
    <b class="big" id="finalScore">0</b>
    <span class="new" id="newBest" data-t="newBest" hidden>Новый рекорд!</span>
    <div class="btns">
      <button type="button" id="revive" class="alt" data-t="revive">Продолжить за рекламу</button>
      <button type="button" id="again" data-t="again">Ещё раз</button>
    </div>
  </section>

  <section class="panel" id="pause" hidden>
    <h2 data-t="paused">Пауза</h2>
    <span class="pulse" data-t="resume">Нажмите, чтобы продолжить</span>
  </section>

  <noscript><p class="panel">Для игры нужен JavaScript.</p></noscript>
</main>

<script src="js/logic.js"></script>
<script src="js/i18n.js"></script>
<script src="js/ya.js"></script>
<script src="js/game.js"></script>
</body>
</html>
